<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Asspp" />
    <title>Asspp Web</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Surface startup failures instead of leaving a blank white page.
      // A runtime error during module evaluation (or a crash that unmounts the
      // React tree) leaves #root empty, which is indistinguishable from a
      // broken deploy. Print it so the cause is visible on the device itself.
      (function () {
        function show(title, detail) {
          var root = document.getElementById('root');
          // Only take over while the app has rendered nothing.
          if (!root || root.childNodes.length) return;
          var box = document.createElement('pre');
          box.setAttribute('data-asspp-error', '1');
          box.style.cssText =
            'margin:0;padding:16px;min-height:100vh;box-sizing:border-box;' +
            'font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;' +
            'white-space:pre-wrap;word-break:break-word;' +
            'color:#b91c1c;background:#fef2f2;-webkit-text-size-adjust:100%';
          box.textContent =
            title +
            '\n\n' +
            'UA: ' +
            navigator.userAgent +
            (detail ? '\n\n' + detail : '');
          root.appendChild(box);
        }
        window.addEventListener('error', function (e) {
          show('Startup error: ' + (e.message || '(no message)'),
               e.error && e.error.stack);
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          show('Unhandled promise rejection: ' + ((r && r.message) || r),
               r && r.stack);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
